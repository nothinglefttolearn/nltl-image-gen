[project]
name = "nltl-image-gen"
version = "0.1.0"
description = "Generate square images of the nltl shapes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nltl-values",
    "pillow>=11",
]

[project.scripts]
nltl-image = "nltl_image.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution is nltl-image-gen (the repo name); the import name is shorter.
module-name = "nltl_image"

[tool.uv.sources]
nltl-values = { git = "https://github.com/nothinglefttolearn/nltl-values", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
